# One repository, two packages: the crate itself and `rubevy-build`, the build-script helper
# that puts a game's `.rb` files into its binary. The helper is std only and depends on nothing
# — it is a *build*-dependency of a game, and a build-dependency on rubevy would build Bevy a
# second time on the build machine.
#
# `cargo test` here is still this package's tests and nothing else (a workspace whose root is a
# package works on the root package by default); `cargo test --workspace` runs the helper's too.
# `cargo package` leaves the nested package out of the `.crate`, and the helper is published
# separately if it is ever published at all.
[workspace]
members = [".", "rubevy-build"]

[package]
name = "rubevy"
version = "0.0.1"
edition = "2024"
# the largest `rust-version` among the dependencies, read with `cargo metadata`:
# bevy 0.19.1 says 1.95.0, sabiruby 0.6 says 1.85, thiserror 2 says 1.71.
rust-version = "1.95.0"
license = "MIT"
description = "Run mruby bytecode (via SabiRuby) inside Bevy"
keywords = ["bevy", "mruby", "ruby", "scripting"]
categories = ["game-development"]
repository = "https://github.com/sabiruby/rubevy"
readme = "README.md"

[features]
default = []
# `require` of a `.rb` file, which needs the reference compiler (a C build). Without it a script
# may still `require` a `.mrb`.
ruby-source = ["dep:sabiruby-compiler"]

[dependencies]
# The VM. 0.5.1 is the lowest that works: it carries the scheduler fix (a task that ends in nil,
# the dormant queue) that `docs/worklog/2026-09-17-restart-burst.md` concluded belonged in the VM
# — on 0.5.0 replacing ten scripts in one frame freezes it. To work against a checkout of the VM
# next to this one, put the redirect in `.cargo/config.toml` (git-ignored):
#   [patch.crates-io]
#   sabiruby = { path = "../sabiruby" }
sabiruby = "0.6"
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_log"] }
thiserror = "2"
# only for the `ruby-source` feature. 0.2.2 is the first compiler that names a 0.5.x VM
# (sabiruby `docs/design/compiler.md`, "Publishing"); rubevy does not call `highlight()`.
sabiruby-compiler = { version = "0.3", features = ["host"], optional = true }

[dev-dependencies]
# `multi_threaded` is bevy's, not this crate's: it is what makes bevy's task pools threads, so
# that `ScriptWorld::answer_with` in `examples/async.rs` and `tests/futures.rs` really works
# beside the frames. The library itself does not ask for it (see `answer_with`'s rustdoc).
# `bevy_camera` is here and not in `[dependencies]` on purpose: rubevy does not know what a
# camera is, and `tests/camera.rs` / `examples/camera_from_ruby.rs` exist to show that it does
# not have to — `Camera2d`, `Camera3d` and `Projection` are ordinary `#[reflect(Component)]`
# types that a script reaches by name. The feature brings `bevy_mesh` and `bevy_window` with it
# (bevy_internal 0.19.1 `Cargo.toml:79-83`), which is why it is not worth adding to the library.
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_log", "bevy_window", "bevy_winit", "x11", "multi_threaded", "bevy_camera"] }
# the tests compile their Ruby in process
sabiruby-compiler = { version = "0.3", features = ["host"] }
# `macros` is the proc macro behind `#[derive(RubyClass)]` / `#[ruby_methods]`, which
# `tests/host_data.rs` uses to show that a game answers a question with an object of its own.
# The library does not want it: a proc macro is a compiler plugin, and rubevy defines no Ruby
# class of its own beyond `Rubevy::Entity` (which is `Vm::data_new` by hand).
sabiruby = { version = "0.6", features = ["macros"] }
# JSON and serde on top of the VM, for `tests/vm_setup.rs` and the example in
# `docs/host-api.md`. **rubevy does not depend on this** — a game that wants `JSON` installs it
# into the VM itself, which is the whole point of the test.
sabiruby-serde = "0.2"

[profile.dev]
debug = "line-tables-only"   # backtraces keep file:line; full DWARF made each binary ~1.7GB

[profile.dev.package."*"]
debug = false                # no debug info for dependencies (Bevy etc.)
